name: CDN server CI

on:
  push:
    branches: [main]

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdn-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cdn-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --check server.js
      - run: npm test
      - name: Build root Docker image
        working-directory: .
        run: docker build --tag adofai-cdn-server:ci .
      - name: Build standalone Docker image
        run: docker build --tag adofai-cdn-server:standalone .
      - name: Container healthcheck
        working-directory: .
        run: |
          docker run --detach --name adofai-cdn-ci --publish 18787:8787 adofai-cdn-server:ci
          trap 'docker rm --force adofai-cdn-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18787/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs adofai-cdn-ci
          exit 1
      - name: Smoke test
        run: |
          UPLOAD_SECRET=ci node server.js &
          sleep 1
          curl -sf http://localhost:8787/health
          node -e "process.stdout.write(Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64'))" > /tmp/ci.png
          curl -sf -X POST http://localhost:8787/upload -H "Authorization: Bearer ci" -H "Content-Type: image/png" --data-binary @/tmp/ci.png
