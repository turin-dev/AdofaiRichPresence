name: CDN server CI

on:
  push:
    paths:
      - 'cdn-server/**'
      - '.github/workflows/cdn-server.yml'

permissions:
  contents: read

concurrency:
  group: cdn-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  pull_request:
    paths:
      - 'cdn-server/**'
      - '.github/workflows/cdn-server.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: npm test
      - name: Build root Docker image
        working-directory: .
        run: docker build --tag adofai-cdn-server:ci .
      - name: Smoke test
        run: |
          UPLOAD_SECRET=ci node server.js &
          sleep 1
          curl -sf http://localhost:8787/health
          node -e "process.stdout.write(Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64'))" > /tmp/ci.png
          curl -sf -X POST http://localhost:8787/upload -H "Authorization: Bearer ci" -H "Content-Type: image/png" --data-binary @/tmp/ci.png
