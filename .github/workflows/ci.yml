name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - name: Smoke test
        run: |
          UPLOAD_SECRET=ci node server.js &
          sleep 1
          curl -sf http://localhost:8787/health
          curl -sf -X POST http://localhost:8787/upload -H "Content-Type: image/png" --data-binary "ci-test-bytes"
