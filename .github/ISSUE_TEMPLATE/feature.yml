name: 기능 제안 / Feature request
description: 불편한 상황과 원하는 동작을 알려주세요.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 원하는 동작과 완료 기준
      description: 개선되었는지 확인할 수 있는 구체적인 예시를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고 화면
